# NavLink test suites. See the vtest README for the format.
#
# Both suites are `script`: NavLink's tests are plain python3 files that print
# PASS/FAIL and exit non-zero, deliberately -- the wire contract three codebases
# generate from has to be testable without a package install.

# Every standalone tests/test_*.py, one case each.
# They read generated/, which is not tracked, so generation is the build step:
# without it a clean tree fails every case for a reason unrelated to the test.
[codec]
adapter = script
dir     = .
filter  = ls tests/test_*.py 2>/dev/null | xargs -r -n1 basename
prefix  = python3 tests/
build   = python3 generate.py
open    = 1

# The full 7-step pipeline: regeneration, the C compile, and the C<->Python
# parity checks over CRC_EXTRA and wire size that no single script covers.
[pipeline]
adapter = script
dir     = .
filter  = echo run_tests.py
prefix  = python3 tests/
