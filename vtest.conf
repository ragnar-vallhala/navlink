# NavLink test suites. See the vtest README for the format.
#
# One ctest project: the Python tests, the compiled C test, and the full
# pipeline all register with ctest, so the standard adapter drives this repo the
# same way it drives the C repos that consume it.
[navlink]
adapter = ctest
dir     = build
prefix  =
configure = cmake -S . -B build
open    = 1

# The C test under ASan + UBSan: the generated codec does the pointer
# arithmetic that packs and unpacks every message, so it is the part worth
# sanitizing. Same case, different -D flags, a build dir vtest configures.
[navlink-asan]
adapter = ctest
dir     = build_san
prefix  =
filter  = ^test_c$
configure = cmake -S . -B build_san -DNAVLINK_SANITIZE=ON

[loc]
adapter = check
cmd     = vtest/loc.sh .
